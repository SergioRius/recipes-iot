#
# Mqtt BMS package for Home Assistant
# ---------------------------------------------------------
# Save in a folder called "packages" in your configuration folder and edit your configuration file to import it, under the homeassitant key.
#
# homeassistant:
#   name: MiHome
#   ...
#   packages: !include_dir_named packages
#
# You will have to replace "bms/<bankname>" mqtt topic along the file to match the topic where your BMS mqtt topics are published.
# This file is complementary for the project named Serial-to-Mqtt BMS, in the node-red's section, and sources the data from it.
# The package gets the field names in the format that are published by Victron's battery devices and adapts them to work with the jk-bms-card. So
# you can use it by feeding the corresponding battery topic from the Venus Mqtt.
# To integrate more than one Battery/BMS/Bank, simply duplicate the code and replace "bms1", "BANK1", and the topic "bms/BANK1" in the new file.
# You can find a sample dashboard alongside this file or find the card on HACS or at the following repository: https://github.com/Pho3niX90/jk-bms-card
# 
# Look for more info on this on my repo.
mqtt:
  sensor:
    # The main device.
    - name: Serial
      unique_id: bms1_serial # internal id, used for device grouping
      device: &bms1_device_info
        name: BMS1
        manufacturer: SergioRius
        identifiers: [BANK1]
      availability: &bms1_availability
        - topic: "bms/BANK1"
          value_template: "{{ 'online' }}"
      expire_after: 30
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['Serial'] }}"
      icon: mdi:bolt

    - name: State Of Charge
      unique_id: bms1_state_of_charge
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: battery
      state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['Soc']|round(1) }}"
      unit_of_measurement: "%"
      suggested_display_precision: 1

    - name: Power
      unique_id: bms1_power
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: power
      state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['Dc']['Power']|round(0) }}"
      unit_of_measurement: "W"
      icon: mdi:battery-charging
      suggested_display_precision: 0

    - name: Total Voltage
      unique_id: bms1_total_voltage
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: voltage
      state_class: measurement 
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['Dc']['Voltage']|round(1) }}"
      unit_of_measurement: "V"
      suggested_display_precision: 1

    - name: Current
      unique_id: bms1_current
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: current
      state_class: measurement 
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['Dc']['Current']|round(1) }}"
      unit_of_measurement: "A"
      suggested_display_precision: 1

    - name: Total Battery Capacity Setting
      unique_id: bms1_total_battery_capacity_setting
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ (value_json['InstalledCapacity'])|round(0) }}"
      unit_of_measurement: "Ah"
      suggested_display_precision: 0

    - name: Total Charging Cycle Capacity
      unique_id: bms1_total_charging_cycle_capacity
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ (value_json['Info']['TotalChargingCycleCapacity']) }}"
      unit_of_measurement: "Ah"
      suggested_display_precision: 0

    - name: ConsumedAh
      unique_id: bms1_consumedah
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ (value_json['ConsumedAmphours'])|round(1) }}"
      unit_of_measurement: "Ah"
      suggested_display_precision: 1

    - name: Capacity Remaining
      unique_id: bms1_capacity_remaining
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ (value_json['RemainingCapacity'])|round(1) }}"
      unit_of_measurement: "Ah"
      suggested_display_precision: 1

    - name: Charging Cycles
      unique_id: bms1_charging_cycles
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ (value_json['History']['ChargeCycles'])|int }}"
      suggested_display_precision: 0

    - name: Total Runtime Formatted
      unique_id: bms1_total_runtime_formatted
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      # state_class: measurement
      state_topic: "bms/BANK1"
      value_template: "{{ (value_json['Info']['TotalRuntimeFormatted']) }}"

    - name: Delta Cell Voltage
      unique_id: bms1_delta_cell_voltage
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: voltage
      state_class: measurement 
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['System']['DiffCellVoltage']|round(3) }}"
      unit_of_measurement: "V"
      suggested_display_precision: 3

    - name: Average Cell Voltage
      unique_id: bms1_average_cell_voltage
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: voltage
      state_class: measurement 
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['System']['AverageCellVoltage']|round(3) }}"
      unit_of_measurement: "V"
      suggested_display_precision: 3

    # Balance Current?

    - name: Min Voltage Cell
      unique_id: bms1_min_voltage_cell
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['System']['MinVoltageCellId'] }}"

    - name: Max Voltage Cell
      unique_id: bms1_max_voltage_cell
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['System']['MaxVoltageCellId'] }}"

    - name: Power Tube Temperature
      unique_id: bms1_power_tube_temperature
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: temperature
      state_class: measurement 
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['System']['MOSTemperature'] }}"
      unit_of_measurement: '°C'
      suggested_display_precision: 0

    - name: Temperature Sensor 1
      unique_id: bms1_temperature_sensor_1
      device: *bms1_device_info
      availability: *bms1_availability
      expire_after: 30
      device_class: temperature
      state_class: measurement 
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['System']['Temperature1'] }}"
      unit_of_measurement: '°C'
      suggested_display_precision: 0

    - name: Temperature Sensor 2
      unique_id: bms1_temperature_sensor_2
      device: *bms1_device_info
      availability: *bms1_availability
