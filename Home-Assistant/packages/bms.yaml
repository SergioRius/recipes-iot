  switch:

    - name: Charging
      unique_id: bms1_charging
      device: *bms1_device_info
      availability: *bms1_availability
      device_class: switch
      state_topic: "bms/BANK1"
      value_template: "{{ value_json['Io']['AllowToCharge'] }}"
      state_on: '1'
      state_off: '0'
      command_topic: "bms/BANK1/set"
      payload_on: '{"AllowToCharge": 1}'
      payload_off: '{"AllowToCharge": 0}'

    - name: Discharging
      unique_id: bms1_discharging
      device: *bms1_device_info
      availability: *bms1_availability
      device_class: switch
      state_topic: "bms/BANK1"
