#
# Victron package for Home Assistant
# ---------------------------------------------------------
# Save in a folder called "packages" in your configuration folder and edit your configuration file to import it, under the homeassitant key.
#
# homeassistant:
#   name: MiHome
#   ...
#   packages: !include_dir_named packages
#
# You will have to replace "venus_get/_set" mqtt topic along the file to match the topic where your venus device publishes
# the data. I use a mqtt redirection to forward all the messages in the GX device to my home assistant mqtt broker.
# Look for more info on this on my repo.
mqtt:
  sensor:
    # The main device.
    - name: Serial
      # object_id: victron_serial # entity_id
      unique_id: victron_serial # internal id, used for device grouping
      # TODO
      # availability: &victron_availability
      #   - topic: victron/announce/9090
      #     value_template: "{{ value_json['state'] }}"
      #     payload_available: "connected"
      #     payload_not_available: "disconnected"
      device: &victron_device_info
        identifiers: [victron_9090]
        configuration_url: http://10.50.0.35
          # - topic: victron/announce/9090
          #   value_template: "{{ value_json['http'] }}"
        manufacturer: Victron
        name: Victron
      state_topic: "venus_get/system/0/Serial"
      value_template: "{{ value_json['value'] }}"
      icon: mdi:bolt

    # Battery: You may have to adjust the device Id (here 288) to match the battery device in your system.
    - name: Battery Soc
      unique_id: victron_battery_soc
      device: *victron_device_info
      device_class: battery
      state_class: measurement
      state_topic: "venus_get/battery/288/Soc"
      value_template: "{{ value_json['value']|round(1) }}"
      unit_of_measurement: "%"

    - name: Battery power
      unique_id: victron_battery_power
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/battery/288/Dc/0/Power"
      value_template: "{{ value_json['value']|round(0) }}"
      unit_of_measurement: "W"
      icon: mdi:battery-charging

    - name: Battery power to
      unique_id: victron_battery_power_to
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/battery/288/Dc/0/Power"
      value_template: > 
        {% if value_json.value | is_defined and value_json.value > 0 %}
          {{ value_json.value|round(0) }}
        {% else %}
          0
        {% endif %}
      unit_of_measurement: "W"
      icon: mdi:battery-arrow-up

    - name: Battery power from
      unique_id: victron_battery_power_from
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/battery/288/Dc/0/Power"
      value_template: > 
        {% if value_json.value | is_defined and value_json.value < 0 %}
          {{ value_json.value|round(0)|abs }}
        {% else %}
          0
        {% endif %}
      unit_of_measurement: "W"
      icon: mdi:battery-arrow-down

    - name: Battery total energy from
      unique_id: victron_battery_total_energy_from
      device: *victron_device_info
      device_class: energy
      state_class: total_increasing
      state_topic: "venus_get/battery/288/History/DischargedEnergy"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "kWh"

    - name: Battery total energy to
      unique_id: victron_battery_total_energy_to
      device: *victron_device_info
      device_class: energy
      state_class: total_increasing
      state_topic: "venus_get/battery/288/History/ChargedEnergy"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "kWh"

    - name: Battery voltage
      unique_id: victron_battery_voltage
      device: *victron_device_info
      device_class: voltage
      state_class: measurement 
      state_topic: "venus_get/battery/288/Dc/0/Voltage"
      value_template: "{{ value_json['value']|round(1) }}"
      unit_of_measurement: "V"

    - name: Battery current
      unique_id: victron_battery_current
      device: *victron_device_info
      device_class: current
      state_class: measurement 
      state_topic: "venus_get/battery/288/Dc/0/Current"
      value_template: "{{ value_json['value']|round(1) }}"
      unit_of_measurement: "A"

    - name: Battery consumed Ah
      unique_id: victron_battery_consumed_ah
      device: *victron_device_info
      state_class: measurement
      state_topic: "venus_get/battery/278/ConsumedAmphours"
      value_template: "{{ (value_json['value'] * -1)|round(1) }}"
      unit_of_measurement: "Ah"

    - name: Battery Cell MinVoltage
      unique_id: victron_battery_cell_minvoltage
      device: *victron_device_info
      device_class: voltage
      state_class: measurement 
      state_topic: "venus_get/battery/1024/System/MinCellVoltage"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "V"

    - name: Battery Cell MaxVoltage
      unique_id: victron_battery_cell_maxvoltage
      device: *victron_device_info
      device_class: voltage
      state_class: measurement 
      state_topic: "venus_get/battery/1024/System/MaxCellVoltage"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "V"


    - name: Vebus alarms overload
      unique_id: victron_vebus_alarms_overload
      device: *victron_device_info
      state_topic: "venus_get/vebus/292/Alarms/Overload"
      value_template: "{{ value_json['value'] }}"
      icon: mdi:alert

    - name: Vebus AcOut Power
      unique_id: victron_vebus_acout_power
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/vebus/292/Ac/Out/P"
      value_template: "{{ value_json['value']|round(0) }}"
      unit_of_measurement: "W"

    
    - name: DC Power
      unique_id: victron_dc_power
      device: *victron_device_info
      availability:
        - topic: "venus_get/system/0/Dc/System/Power"
          value_template: "{{ value_json['value']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: power
      state_class: measurement
      state_topic: "venus_get/system/0/Dc/System/Power"
      value_template: "{{ value_json['value']|round(0) }}"
      unit_of_measurement: "W"


    - name: SolarCharger 1 power
      unique_id: victron_solarcharger_1_power
      device: *victron_device_info
      availability:
        - topic: "venus_get/solarcharger/290/Yield/Power"
          value_template: "{{ value_json['value']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: power
      state_class: measurement
      state_topic: "venus_get/solarcharger/290/Yield/Power"
      value_template: "{{ value_json['value']|round(0) }}"
      unit_of_measurement: "W"
      icon: mdi:white-balance-sunny

    - name: SolarCharger 1 voltage
      unique_id: victron_solarcharger_1_voltage
      device: *victron_device_info
      device_class: voltage
      state_class: measurement
      state_topic: "venus_get/solarcharger/290/Pv/V"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "V"
      icon: mdi:white-balance-sunny

    - name: SolarCharger 1 current
      unique_id: victron_solarcharger_1_current
      device: *victron_device_info
      device_class: current
      state_class: measurement
      state_topic: "venus_get/solarcharger/290/Dc/0/Current"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "A"
      icon: mdi:white-balance-sunny
 
    - name: SolarCharger 1 energy today
      unique_id: victron_solarcharger_1_energy_today
      device: *victron_device_info
      device_class: energy
      state_class: total_increasing
      state_topic: "venus_get/solarcharger/290/History/Daily/0/Yield"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "kWh"
      icon: mdi:white-balance-sunny

    - name: SolarCharger 2 power
      unique_id: victron_solarcharger_2_power
      device: *victron_device_info
      availability:
        - topic: "venus_get/solarcharger/291/Yield/Power"
          value_template: "{{ value_json['value']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: power
      state_class: measurement
      state_topic: "venus_get/solarcharger/291/Yield/Power"
      value_template: "{{ value_json['value']|round(0) }}"
      unit_of_measurement: "W"
      icon: mdi:white-balance-sunny

    - name: SolarCharger 2 voltage
      unique_id: victron_solarcharger_2_voltage
      device: *victron_device_info
      device_class: voltage
      state_class: measurement
      state_topic: "venus_get/solarcharger/291/Pv/V"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "V"
      icon: mdi:white-balance-sunny
 
    - name: SolarCharger 2 current
      unique_id: victron_solarcharger_2_current
      device: *victron_device_info
      device_class: current
      state_class: measurement
      state_topic: "venus_get/solarcharger/291/Dc/0/Current"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "A"
      icon: mdi:white-balance-sunny

    - name: SolarCharger 2 energy today
      unique_id: victron_solarcharger_2_energy_today
      device: *victron_device_info
      device_class: energy
      state_class: total_increasing
      state_topic: "venus_get/solarcharger/291/History/Daily/0/Yield"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "kWh"
      icon: mdi:white-balance-sunny

    - name: PvInverter Dc1 power
      unique_id: victron_pvinverter_dc1_power
      device: *victron_device_info
      availability:
        - topic: solax/state
          value_template: "{{ value_json['PowerDc1']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: power
      state_class: measurement
      state_topic: solax/state
      value_template: "{{ value_json['PowerDc1']|round(0) }}"
      unit_of_measurement: "W"
      icon: mdi:white-balance-sunny

    - name: PvInverter Dc1 voltage
      unique_id: victron_pvinverter_dc1_voltage
      device: *victron_device_info
      availability:
        - topic: solax/state
          value_template: "{{ value_json['Vdc1']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: voltage
      state_class: measurement
      state_topic: solax/state
      value_template: "{{ value_json['Vdc1']|round(1) }}"
      unit_of_measurement: "V"

    - name: PvInverter Dc1 current
      unique_id: victron_pvinverter_dc1_current
      device: *victron_device_info
      availability:
        - topic: solax/state
          value_template: "{{ value_json['Idc1']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: current
      state_class: measurement
      state_topic: solax/state
      value_template: "{{ value_json['Idc1']|round(1) }}"
      unit_of_measurement: "A"

    - name: PvInverter Ac power
      unique_id: victron_pvinverter_ac_power
      device: *victron_device_info
      availability:
        - topic: venus_get/pvinverter/20/Ac/L1/Power
          value_template: "{{ value_json['value']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: power
      state_class: measurement
      state_topic: "venus_get/pvinverter/20/Ac/L1/Power"
      value_template: "{{ value_json['value']|round(0) }}"
      unit_of_measurement: "W"
      icon: mdi:white-balance-sunny

    - name: PvInverter Ac voltage
      unique_id: victron_pvinverter_ac_voltage
      device: *victron_device_info
      availability:
        - topic: venus_get/pvinverter/20/Ac/L1/Voltage
          value_template: "{{ value_json['value']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: voltage
      state_class: measurement
      state_topic: "venus_get/pvinverter/20/Ac/L1/Voltage"
      value_template: "{{ value_json['value']|round(1) }}"
      unit_of_measurement: "V"

    - name: PvInverter Ac current
      unique_id: victron_pvinverter_ac_current
      device: *victron_device_info
      availability:
        - topic: venus_get/pvinverter/20/Ac/L1/Current
          value_template: "{{ value_json['value']|is_number }}"
          payload_available: true
          payload_not_available: false
      device_class: current
      state_class: measurement
      state_topic: "venus_get/pvinverter/20/Ac/L1/Current"
      value_template: "{{ value_json['value']|round(1) }}"
      unit_of_measurement: "A"
      
    - name: PvInverter energy total
      unique_id: victron_pvinverter_energy_total
      device: *victron_device_info
      device_class: energy
      state_class: total_increasing
      state_topic: "venus_get/pvinverter/20/Ac/L1/Energy/Forward"
      value_template: "{{ value_json['value'] }}"
      unit_of_measurement: "kWh"
      icon: mdi:white-balance-sunny

    - name: PvInverter power limit
      unique_id: victron_pvinverter_power_limit
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/pvinverter/20/Ac/MaxPower"
      value_template: "{{ value_json['value'] | round(0) }}"
      unit_of_measurement: "W"


    - name: Grid power
      unique_id: victron_grid_power
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/grid/30/Ac/Power"
      value_template: "{{ value_json['value'] | round(0) }}"
      unit_of_measurement: "W"
      icon: mdi:transmission-tower

    - name: Grid voltage
      unique_id: victron_grid_voltage
      device: *victron_device_info
      device_class: voltage
      state_class: measurement
      state_topic: "venus_get/grid/30/Ac/Voltage"
      value_template: "{{ value_json['value'] | round(2) }}"
      unit_of_measurement: "V"

    - name: Grid frequency
      unique_id: victron_grid_frequency
      device: *victron_device_info
      device_class: frequency
      state_class: measurement
      state_topic: "venus_get/vebus/292/Ac/Out/L1/F"  #"venus_get/vebus/292/Ac/ActiveIn/L1/F"
      value_template: "{{ value_json['value'] | round(2) }}"
      unit_of_measurement: "Hz"

    - name: Grid power from
      unique_id: victron_grid_power_from
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/grid/30/Ac/Power"
      value_template: > 
        {% if value_json.value | is_defined and value_json.value > 0 %}
          {{ value_json.value|round(0) }}
        {% else %}
          0
        {% endif %}
      unit_of_measurement: "W"
      icon: mdi:transmission-tower-export

    - name: Grid power to
      unique_id: victron_grid_power_to
      device: *victron_device_info
      device_class: power
      state_class: measurement
      state_topic: "venus_get/grid/30/Ac/Power"
      value_template: > 
        {% if value_json.value | is_defined and value_json.value < 0 %}
          {{ value_json.value|abs|round(0) }}
        {% else %}
          0
        {% endif %}
      unit_of_measurement: "W"
      icon: mdi:transmission-tower-import
 
    - name: Grid energy import
      unique_id: victron_grid_energy_import
      device: *victron_device_info
      icon: mdi:transmission-tower-export
      device_class: energy
      state_class: total_increasing
      state_topic: "venus_get/grid/30/Ac/L1/Energy/Forward"
      value_template: "{{ value_json['value'] | round(1) }}"
      unit_of_measurement: "kWh"

    - name: Grid energy export
      unique_id: victron_grid_energy_export
      device: *victron_device_info
      icon: mdi:transmission-tower-import
      device_class: energy
      state_class: total_increasing
      state_topic: "venus_get/grid/30/Ac/L1/Energy/Reverse"
      value_template: "{{ value_json['value'] | round(1) }}"
      unit_of_measurement: "kWh"


  binary_sensor:
    # This sensor, consumes data from your BMS battery.
    # Change 1024 to the actual device id of your battery.
    - name: Battery balancing
      unique_id: victron_battery_balancing
      device: *victron_device_info
      state_topic: "venus_get/battery/1024/Balancing"
      value_template: "{{ value_json['value'] }}"
      payload_on: 1
      payload_off: 0
      icon: mdi:scale-balance

    - name: Vebus AcIn1Available
      unique_id: victron_vebus_acin1available
      device: *victron_device_info
      state_topic: "venus_get/vebus/292/Ac/State/AcIn1Available"
      value_template: "{{ value_json['value'] }}"
      payload_on: 1
      payload_off: 0
      icon: mdi:power-plug


    - name: SolarCharger 1 Relay0State
      unique_id: victron_solarcharger_1_relay0state
      device: *victron_device_info
      state_topic: "venus_get/solarcharger/290/Relay/0/State"
      value_template: "{{ value_json['value'] }}"
      payload_on: 1
      payload_off: 0
      icon: mdi:white-balance-sunny


  number:
    - name: Settings GridSetpoint
      unique_id: victron_settings_gridsetpoint
      device: *victron_device_info
      icon: mdi:scale-balance
      state_topic: "venus_get/settings/0/Settings/CGwacs/AcPowerSetPoint"
      value_template: "{{ value_json['value']|round(0) }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/AcPowerSetPoint"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: W
      min: -7500
      max: 7500
      step: 1
      mode: box

    - name: Settings GridCurrentLimit
      unique_id: victron_settings_gridcurrentlimit
      device: *victron_device_info
      icon: mdi:cog
      state_topic: "venus_get/vebus/292/Ac/ActiveIn/CurrentLimit"
      value_template: "{{ value_json['value']|round(0) }}"
      command_topic: "venus_set/vebus/292/Ac/ActiveIn/CurrentLimit"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: A
      min: 0
      max: 64
      step: 0.5
      mode: box

    - name: Settings MaxDischargePower
      unique_id: victron_settings_maxdischargepower
      device: *victron_device_info
      icon: mdi:cog
      state_topic: "venus_get/settings/0/Settings/CGwacs/MaxDischargePower"
      value_template: "{{ value_json['value']|round(0) }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/MaxDischargePower"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: W
      min: -1
      max: 1000000
      step: 1
      mode: box

    - name: Settings GridMaxFeedin
      unique_id: victron_settings_gridmaxfeedin
      device: *victron_device_info
      icon: mdi:cog
      state_topic: "venus_get/settings/0/Settings/CGwacs/MaxFeedInPower"
      value_template: "{{ value_json['value']|round(0) }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/MaxFeedInPower"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: W
      min: -1
      max: 7400
      step: 1
      mode: box

    - name: Settings GridPeakShaving ImportLimit
      unique_id: victron_settings_gridpeakshaving_importlimit
      device: *victron_device_info
      icon: mdi:cog
      state_topic: "venus_get/settings/0/Settings/CGwacs/AcInputLimit"
      value_template: "{{ value_json['value']|round(0) }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/AcInputLimit"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: A
      min: -1
      max: 10000
      step: 1
      mode: box

    - name: Settings GridPeakShaving ExportLimit
      unique_id: victron_settings_gridpeakshaving_exportlimit
      device: *victron_device_info
      icon: mdi:cog
      state_topic: "venus_get/settings/0/Settings/CGwacs/AcExportLimit"
      value_template: "{{ value_json['value']|round(0) }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/AcExportLimit"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: A
      min: -1
      max: 10000
      step: 1
      mode: box


    - name: Settings Battery MinSoc
      unique_id: victron_settings_battery_minsoc
      device: *victron_device_info
      icon: mdi:battery-minus
      state_topic: "venus_get/settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit"
      value_template: "{{ value_json['value'] }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: '%'
      min: 0
      max: 100
      step: 1
      mode: box

    - name: Settings Battery DVCCMaxVoltage
      unique_id: victron_settings_battery_dvccmaxvoltage
      device: *victron_device_info
      icon: mdi:battery-plus
      state_topic: "venus_get/settings/0/Settings/SystemSetup/MaxChargeVoltage"
      value_template: "{{ value_json['value'] }}"
      command_topic: "venus_set/settings/0/Settings/SystemSetup/MaxChargeVoltage"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: V
      min: 0
      max: 63
      step: 1
      mode: box

    - name: Settings Battery DVCCMaxCurrent
      unique_id: victron_settings_battery_dvccmaxcurrent
      device: *victron_device_info
      icon: mdi:battery-plus
      state_topic: "venus_get/settings/0/Settings/SystemSetup/MaxChargeCurrent"
      value_template: "{{ value_json['value'] }}"
      command_topic: "venus_set/settings/0/Settings/SystemSetup/MaxChargeCurrent"
      command_template: '{"value":{{ value }}}'
      unit_of_measurement: A
      min: -1
      max: 300
      step: 1
      mode: box

  switch:
    - name: Settings feedin Dc
      unique_id: victron_settings_feedin_dc
      device: *victron_device_info
      icon: mdi:car-speed-limiter
      state_topic: "venus_get/settings/0/Settings/CGwacs/OvervoltageFeedIn"
      value_template: "{{ value_json['value'] }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/OvervoltageFeedIn"
      state_on: 1
      state_off: 0
      payload_on: '{"value": 1}'
      payload_off: '{"value": 0}'

    - name: Settings feedin Ac
      unique_id: victron_settings_feedin_ac
      device: *victron_device_info
      icon: mdi:car-speed-limiter
      state_topic: "venus_get/settings/0/Settings/CGwacs/PreventFeedback"
      value_template: "{{ value_json['value'] }}"
      command_topic: "venus_set/settings/0/Settings/CGwacs/PreventFeedback"
      state_on: 0
      state_off: 1
      payload_on: '{"value": 0}'
      payload_off: '{"value": 1}'


  select:
    - name: ESS State
      unique_id: victron_ess_state
      device: *victron_device_info
      # availability: *victron_availability
      icon: mdi:cog
      state_topic: "venus_get/settings/0/Settings/CGwacs/BatteryLife/State"
      value_template: >-
        {% set values = { 9:'Mantener', 10:'Optimizado', 11:'Optimizado (Bajo)', 12:'Optimizado (Recarga)'} %}
        {{ values[value_json['value']] if value_json['value'] in values.keys() else 'Desconocido' }}
      command_topic: "venus_set/settings/0/Settings/CGwacs/BatteryLife/State"
      command_template: >-
        {% set values = { 'Mantener':'9', 'Optimizado':'10', 'Optimizado (Bajo)':'11',  'Optimizado (Recarga)':'12'} %}
        {{ '{"value":'+values[value]+'}' if value in values.keys() else '10' }}
      options:
        - Desconocido
        - Optimizado
        - Optimizado (Bajo)
        - Optimizado (Recarga)
        - Mantener

    - name: Vebus Mode
      unique_id: victron_vebus_mode
      device: *victron_device_info
      # availability: *victron_availability
      icon: mdi:cog
      state_topic: "venus_get/vebus/292/Mode"
      value_template: >-
        {% set values = { 0:'Apagado', 1:'Solo cargador', 2:'Solo inversor', 3:'Encendido'} %}
        {{ values[value_json['value']] if value_json['value'] in values.keys() else 'Desconocido' }}
      command_topic: "venus_set/vebus/292/Mode"
      command_template: >-
        {% set values = { 'Apagado':'0', 'Solo cargador':'1', 'Solo inversor':'2', 'Encendido':'3'} %}
        {{ '{"value":'+values[value]+'}' if value in values.keys() else '3' }}
      options:
        - Desconocido
        - Apagado
        - Solo cargador
        - Solo inversor
        - Encendido

template:

  - sensor:

    - name: Victron SolarCharger total power
      unique_id: victron_solarcharger_total_power
      device_class: power
      state_class: measurement
      state: >
        {{ (
          states('sensor.victron_solarcharger_1_power')|default(0)|float(0) 
          + states('sensor.victron_solarcharger_2_power')|default(0)|float(0) 
          )|round(0)
        }}
      unit_of_measurement: "W"
      icon: mdi:white-balance-sunny

    - name: Victron PvSources total power
      unique_id: victron_pvsources_total_power
      device_class: power
      state_class: measurement
      state: >
        {{ (
          states('sensor.victron_solarcharger_1_power')|default(0)|float(0) 
          + states('sensor.victron_solarcharger_2_power')|default(0)|float(0) 
          + states('sensor.victron_pvinverter_ac_power')|default(0)|float(0)
          )|round(0)
        }}
      unit_of_measurement: "W"
      icon: mdi:white-balance-sunny

    # Groups: Storage

    - name: Victron Battery Cell DiffVoltage
      unique_id: victron_battery_cell_diffvoltage
      device_class: voltage
      state_class: measurement
      state: >
        {{ (
          states('sensor.victron_battery_cell_maxvoltage')|float(0) 
          - states('sensor.victron_battery_cell_minvoltage')|float(0)
          )|round(3) }}
      unit_of_measurement: "V"

